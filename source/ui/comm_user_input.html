<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;padding:4px 0}
#ui{width:100%;max-width:360px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-end}
.msg{max-width:78%;background:#95ec69;border-radius:8px 8px 3px 8px;padding:8px 12px;font-size:13px;line-height:1.5;color:#1c1c1e;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meta{font-size:10px;color:#8a8d99;margin:4px 2px 0}
</style>
</head>
<body>
<div id="ui"></div>
<script>
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getMsg(){try{var c=getChatMessages(getCurrentMessageId());if(!c||c.length===0)return null;return c[0].message;}catch(e){return null;}}
function init(){
  var el=document.getElementById('ui');if(!el)return;
  var msg=getMsg();if(!msg){el.innerHTML='';return;}
  var m=msg.match(/^\s*(?:发信息|发短信|发微信|发消息|发讯息|回信息|回短信|回微信|回消息|短信|微信)\s*(?:给)?\s*([^：:\r\n]{1,12})\s*[：:]\s*(.+)$/m);
  if(!m){el.innerHTML='';return;}
  var who=m[1].trim(),txt=m[2].trim();
  el.innerHTML='<div class="msg">'+esc(txt).replace(/\n/g,'<br>')+'</div><div class="meta">发送给：'+esc(who)+'</div>';
}
$(function(){init();});
</script>
</body>
</html>
