<head></head>
<div id="scarlet-ui-loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#e2e8f0;font:14px/1.6 'Microsoft YaHei',sans-serif;z-index:9999">正在加载官场模拟器界面…</div>
<script>
(() => {
  const URLS = [
    'https://cdn.jsdelivr.net/gh/sage1717/guanchang-simulator@master/source/ui/scarlet/index.html',
    'https://testingcf.jsdelivr.net/gh/sage1717/guanchang-simulator@master/source/ui/scarlet/index.html',
  ];
  const loading = document.getElementById('scarlet-ui-loading');
  (async () => {
    let html = null;
    for (const url of URLS) {
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        if (res.ok) { html = await res.text(); break; }
      } catch (e) { /* 下一源 */ }
    }
    if (!html) {
      loading.textContent = '界面加载失败：无法连接 CDN（需联网）。请检查网络后重试或刷新。';
      loading.style.background = '#450a0a';
      loading.style.color = '#fecaca';
      return;
    }
    loading.remove();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const el of Array.from(doc.head.children)) {
      if (['LINK', 'STYLE', 'META'].includes(el.tagName)) {
        document.head.appendChild(document.importNode(el, true));
      }
    }
    const host = document.createElement('div');
    host.id = 'scarlet-ui-host';
    host.innerHTML = doc.body.innerHTML;
    host.querySelectorAll('script').forEach(s => s.remove()); // 移除未执行原稿，只保留副本
    document.body.appendChild(host);
    const allScripts = [
      ...Array.from(doc.head.querySelectorAll('script')),
      ...Array.from(doc.body.querySelectorAll('script')),
    ];
    for (const s of allScripts) {
      const ns = document.createElement('script');
      if (s.src) { ns.src = s.src; ns.async = false; } else { ns.textContent = s.textContent; }
      host.appendChild(ns);
    }
  })();
})();
</script>
